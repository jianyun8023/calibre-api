services:
  # main service
  calibre-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: calibre-api
    image: ghcr.io/jianyun8023/calibre-api:latest
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - CALIBRE_DEBUG=true
      - CALIBRE_CONTENT_SERVER=https://lib.pve.icu
      - CALIBRE_SEARCH_INDEX=books
      - CALIBRE_TMPDIR=/tmp
      - CALIBRE_METADATA_DOUBANURL=http://192.168.2.236:8085
      - CALIBRE_MCP_ENABLED=false

