name: Build Calibre-API Images
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-push:
    uses: ./.github/workflows/reusable-build.yaml
    with:
      image_name: calibre-api
      context: .
      file: Dockerfile
      # If release, use tag name, otherwise default to 0.0.1 (or whatever default is appropriate)
      build_version: ${{ github.event.release.tag_name || '0.0.1' }}
      tags_config: |
        type=raw,value=${{ github.event.release.tag_name || '0.0.1' }}
        type=raw,value=latest
    secrets: inherit
