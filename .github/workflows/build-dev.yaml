name: Build Dev Images
on:
  workflow_dispatch:
  push:

jobs:
  build-and-push:
    uses: ./.github/workflows/reusable-build.yaml
    with:
      image_name: calibre-api
      context: .
      file: Dockerfile
      build_version: dev
      tags_config: |
        type=raw,value=dev
    secrets: inherit
